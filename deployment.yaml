apiVersion: apps/v1
kind: Deployment
metadata:
  name: myportfolio-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myportfolio
  template:
    metadata:
      labels:
        app: myportfolio
    spec:
      containers:
        - name: myportfolio
          image: "docker.io/akashshewale0801/myportfolio:latest" # Replace with your image name
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: myportfolio-service
spec:
  selector:
    app: myportfolio
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
